name: Go CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: Lint Code
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
      - name: Build
        run: go build -v ./...
      - name: Run Tests
        run: go test -v -race ./...
