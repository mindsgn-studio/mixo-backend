name: Staging to Main

on:
  push:
    branches: [ "staging" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Lint Code
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
      - name: Build
        run: go build -v ./...
      - name: Run Tests
        run: go test -v -race ./...

  create-pr:
    name: Create PR to Main
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: staging
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: staging
          base: main
          title: "Release: staging → main"
          body: |
            Automated PR from staging to main.
            
            All CI checks (lint, build, test) have passed.
          labels: automated,release
